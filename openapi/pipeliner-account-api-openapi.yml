        content:
          application / json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/batchAccountInput'
      responses:
        '200':
          description: Creation confirmation. Returns a list of created / updated Accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: True when response succeeded, false on error.
                  data:
                    type: array
                    items:
                      oneOf:
                      - type: string
                        description: And ID of created / updated entity.
                        format: uuid
                      - $ref: '#/components/schemas/Error'
        '500':
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /entities/Accounts/batch-restore:
    post:
