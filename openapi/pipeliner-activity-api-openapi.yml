        revision:
          type: integer
          format: int32
          example: 1
          description: Revision when entity was lastly changed.
    createAppointmentClientInviteesRelationInput:
      properties:
        modified:
          type: string
          format: date-time
          example: '2019-01-01T00:00:00'
          description: Last modification time.
          readOnly: true
        created:
          type: string
          format: date-time
          example: '2019-01-01T00:00:00'
          description: Creation time.
          readOnly: true
        appointment_id:
          type: string
          format: uuid
          example: 01234567-abcd-dcba-ffff-000000000000
          description: Id of the appointment.
        client_id:
          type: string
          format: uuid
          example: 01234567-abcd-dcba-ffff-000000000000
          description: Id of the user.
        response:
          type: integer
          description: 'Invitee response (e.g. Accepted, Tentative, Declined, Pending).


            Integer enum value: 0 - NoResponse, 1 - Accepted, 2 - Rejected'
          example: 0
          enum:
          - 0
          - 1
          - 2
        revision:
          type: integer
          format: int32
          example: 1
          description: Revision when entity was lastly changed.
      required:
      - appointment_id
      - client_id
    updateTaskInput:
      properties:
        media_transcription_id:
          type: string
          format: uuid
          example: 01234567-abcd-dcba-ffff-000000000000
          description: Id of the linked Media record holding the activity's call recording / transcription, when available.
        activity_type_id:
          type: string
          format: uuid
          example: 01234567-abcd-dcba-ffff-000000000000
          description: Id of the task type.
        call_duration:
          type: integer
          format: int32
          example: 1
          description: Duration of the recorded call. Set automatically when the task is linked to a call log.
        call_id:
          type: string
          format: uuid
          example: 01234567-abcd-dcba-ffff-000000000000
          description: Id of the linked call record.
        call_outcome_id:
          type: string
          format: uuid
          example: 01234567-abcd-dcba-ffff-000000000000
          description: Id of the call outcome value.
        currency_exchange_rates_list_id:
          type: string
          format: uuid
          example: 01234567-abcd-dcba-ffff-000000000000
          description: Id of the currency exchange rate list applied to this task.
        description:
          type: string
          example: string
          description: Free-form description of what the task entails.
        due_date:
          type: string
          format: date
          example: '2019-01-01'
          description: Date by which the task is expected to be completed.
        duration:
          type: number
          format: double
          example: '4.32'
          description: Estimated duration of the task. Stored as a duration value (days/hours/minutes).
        owner_id:
          type: string
          format: uuid
          example: 01234567-abcd-dcba-ffff-000000000000
          description: Id of the task owner.
        priority:
          type: integer
          description: 'Priority level of the task (e.g. Low, Normal, High, Urgent).


            Integer enum value: 1 - Low, 2 - Medium, 3 - High'
          example: 1
          enum:
          - 1
          - 2
          - 3
        share_mode:
          type: integer
          description: 'Sharing model applied on top of the owner/unit visibility (e.g. shared with selected sales units or selected users).


            Integer enum value: 0 - Standard, 1 - Private, 2 - AllView, 3 - AllEdit'
          example: 0
          enum:
          - 0
          - 1
          - 2
          - 3
        start_date:
          type: string
          format: date
          example: '2019-01-01'
          description: Date when work on the task is scheduled to begin.
        status:
          type: integer
          description: 'Current status of the task (NotStarted, InProgress, Completed, Deferred). Toggling to Completed marks any linked checklist items as done.


            Integer enum value: 1 - NotStarted, 2 - InProgress, 3 - Waiting, 4 - Completed, 5 - Deferred'
          example: 1
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
        subject:
          type: string
          example: string
