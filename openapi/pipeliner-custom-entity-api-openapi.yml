components:
  schemas:
    batchCustomEntityTypeInput:
      properties:
        form_edit:
          type: object
          description: JSON definition of the form layout used by the UI when creating or editing records of this custom entity type.
        is_readonly:
          type: boolean
          example: false
          description: True when the custom entity type is system-managed and cannot be edited or deleted by users.
        name:
          type: string
          example: string
          description: Name of the entity and its default text representation.
        settings:
          type: string
          format: binary
          example: blob
          description: Per-type configuration for records of this entity type, e.g. allowed task and appointment types that may be linked to records of this type.
        id:
          description: ID of object to update.
          type: string
          format: uuid
    createCustomEntityInput:
      properties:
        modified:
          type: string
          format: date-time
          example: '2019-01-01T00:00:00'
          description: Last modification time.
          readOnly: true
        created:
          type: string
          format: date-time
          example: '2019-01-01T00:00:00'
          description: Creation time.
          readOnly: true
