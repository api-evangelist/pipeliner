          description: Id of the online form template, or empty when not associated with a form.
        parent_cloud_object_folder_id:
          type: string
          format: uuid
          example: 01234567-abcd-dcba-ffff-000000000000
          description: Id of the parent folder, or empty for top-level folders.
        revision:
          type: integer
          format: int32
          example: 1
          description: Revision when entity was lastly changed.
      required:
      - name
