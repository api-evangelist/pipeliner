          16 - allows to set entity on deleted relationship.'
        schema:
          type: integer
          format: int32
      requestBody:
        description: data of new Email
        required: true
        content:
          application / json:
            schema:
              $ref: '#/components/schemas/createEmailInput'
      responses:
        '201':
          description: Creation confirmation. Returns created Email
