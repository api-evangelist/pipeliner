components:
  schemas:
    createFieldPermissionInput:
      properties:
        modified:
          type: string
          format: date-time
          example: '2019-01-01T00:00:00'
          description: Last modification time.
          readOnly: true
        created:
          type: string
          format: date-time
          example: '2019-01-01T00:00:00'
          description: Creation time.
          readOnly: true
        field_id:
          type: string
          format: uuid
          example: 01234567-abcd-dcba-ffff-000000000000
          description: Id of the custom field.
        master_right_id:
          type: string
          format: uuid
          example: 01234567-abcd-dcba-ffff-000000000000
          description: Id of the user role.
        permission_level:
          type: integer
          description: 'Field whose values are strictly defined with an enumeration of values.


            Integer enum value: 1 - FullAccess, 2 - Readonly, 3 - NoAccess'
          example: 1
          enum:
          - 1
          - 2
          - 3
        is_published:
          type: boolean
          example: false
          description: True when the permission override is published; false while it exists only as an unpublished draft.
          readOnly: true
        revision:
          type: integer
          format: int32
          example: 1
          description: Revision when entity was lastly changed.
      required:
      - field_id
      - master_right_id
    createFieldInput:
      properties:
        modified:
          type: string
          format: date-time
          example: '2019-01-01T00:00:00'
          description: Last modification time.
          readOnly: true
        created:
          type: string
          format: date-time
          example: '2019-01-01T00:00:00'
          description: Creation time.
          readOnly: true
        entity_name:
          type: string
          example: string
          description: Related entity name for field (e.g. Account, Contact, Lead, Opportunity, ...)
          readOnly: true
        name:
          type: string
          example: string
          description: User friendly name for field.
        type_id:
          type: string
          example: string
          description: 'Type of the field. Supported field types are: checkbox, currency, currency_foreign, date, datetime, dropdown, email, float, input, integer, multiselect_checkbox, phone, radio, sequence, text_area, url'
        data_set_id:
          type: string
          format: uuid
          example: 01234567-abcd-dcba-ffff-000000000000
