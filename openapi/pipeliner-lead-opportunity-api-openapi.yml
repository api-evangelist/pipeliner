          type: string
          example: 1
          enum:
          - 1
          - 2
          - 4
          - 8
          - 16
          - 32
          - 64
          description: "Bit Flag field, with limited combination of integer values.\n    \nOptions:\nSunday = 1 (0b0000001)\nMonday = 2 (0b0000010)\nTuesday = 4 (0b0000100)\nWednesday = 8 (0b0001000)\nThursday = 16 (0b0010000)\nFriday = 32 (0b0100000)\nSaturday = 64 (0b1000000) The days of week in bit mask, number where every bit means one day (e.g. 0010001 = every Monday and Friday), bit 0 is Monday. This setting is applicable only for RecurrenceTypeEnum.Weekly, RecurrenceTypeEnum.MonthlyAbsolute, RecurrenceTypeEnum.YearlyAbsolute."
        end_date:
          type: string
          format: date
          example: '2019-01-01'
          description: Date information. The last date when no more other items should be created.
        month:
          type: integer
          description: 'Field whose values are strictly defined with an enumeration of values. The number of month this setting is applicable only     for RecurrenceTypeEnum.YearlyAbsolute and RecurrenceTypeEnum.YearlyRelative.


