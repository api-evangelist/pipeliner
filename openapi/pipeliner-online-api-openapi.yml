      - name: id
        in: path
        description: ID of OnlineForm to update
        required: true
        schema:
          type: string
          format: uuid
      - name: validation-level
        in: query
        description: 'Specify validation level of OnlineForm on update. Use them as bit mask: 0 - validate each field on entity,

