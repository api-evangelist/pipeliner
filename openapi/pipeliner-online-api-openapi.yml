    OnlineFormActivityLogLine:
      properties:
        formatted_text:
          type: string
          example: string
          description: Human-readable rendering of the log line, prefixed with the line's timestamp and (when applicable) the parent record id.
        is_delete_protected:
          type: boolean
          example: false
          description: Tells if the entity instance is protected against delete (Entities that need to be present in the system at any time). Delete action still may fail if entity is deletable, due some other additional validations.
          readOnly: true
        id:
          type: string
          format: uuid
          example: 01234567-abcd-dcba-ffff-000000000000
          description: Unique identifier of entity.
          readOnly: true
        is_deleted:
          type: boolean
          example: false
          description: Specifies if the entity is considered deleted.
          readOnly: true
        modified:
          type: string
          format: date-time
          example: '2019-01-01T00:00:00'
          description: Last modification time.
          readOnly: true
        created:
          type: string
          format: date-time
          example: '2019-01-01T00:00:00'
          description: Creation time.
          readOnly: true
        online_form:
          type: string
          format: uri
          description: 'Online form submission this log line belongs to.


            Relation to OnlineForm. By default it is returned as URI to related resource. Using parameter ''expand'', it will return full entity. See: ''OnlineForm'' object for properties.'
        executed_at:
          type: string
          format: date-time
          example: '2019-01-01T00:00:00'
          description: Timestamp the step represented by this line was executed. Empty for scheduled steps that have not yet run.
        is_visible:
          type: boolean
          example: false
          description: True when the line is shown in the activity log UI; false for internal-only lines.
        online_form_id:
          type: string
          format: uuid
          example: 01234567-abcd-dcba-ffff-000000000000
          description: Id of the submission.
        sort_order:
          type: integer
          format: int32
          example: 1
          description: Position of the line within its log run.
        status:
          type: integer
          description: 'Field whose values are strictly defined with an enumeration of values.


            Integer enum value: 1 - Ok, 2 - Warning, 3 - Error, 4 - Scheduled, 5 - Expired'
          example: 1
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
      required:
      - formatted_text
      - is_delete_protected
      - id
      - online_form
      - online_form_id
      - sort_order
