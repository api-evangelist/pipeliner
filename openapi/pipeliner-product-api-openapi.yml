        description: Specify rollback method for Products. 0 - rollback all, 1 - rollback only failed records.
        schema:
          type: integer
          format: int32
      requestBody:
        description: List of ids to delete.
        required: true
        content:
          application / json:
            schema:
              type: array
              items:
                type: string
                description: An id of entity Product to delete.
                format: uuid
      responses:
        '200':
          description: Batch removal confirmation
          content:
