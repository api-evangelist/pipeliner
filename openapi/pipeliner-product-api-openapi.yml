            Relation to OpptyProductRelationType. By default it is returned as URI to related resource. Using parameter ''expand'', it will return full entity. See: ''OpptyProductRelationType'' object for properties.'
        form_edit:
          type: object
          description: JSON definition of the form layout used by the UI when creating or editing products of this type.
        is_readonly:
          type: boolean
          example: false
          description: True when the product type is system-managed and cannot be edited or deleted by users.
        name:
          type: string
          example: string
          description: Name of the entity and its default text representation.
        oppty_product_relation_type_id:
          type: string
          format: uuid
          example: 01234567-abcd-dcba-ffff-000000000000
          description: Id of the paired opportunity/quote line-item type.
        is_published:
          type: boolean
          example: false
          description: True when the entity configuration is published; false while it exists only as an unpublished draft.
          readOnly: true
        revision:
          type: integer
          format: int32
          example: 1
          description: Revision when entity was lastly changed.
