      tags:
      - Text
      parameters:
      - name: validation-level
        in: query
        description: 'Specify validation level of TextMessage on create. Use them as bit mask: 0 - validate each field on entity,

          2 - validate only changed fields, 4 - validate only system fields, 8 - allows to override readonly fields,

          16 - allows to set entity on deleted relationship.'
        schema:
          type: integer
          format: int32
      requestBody:
        description: data of new TextMessage
        required: true
        content:
          application / json:
            schema:
              $ref: '#/components/schemas/createTextMessageInput'
      responses:
        '201':
          description: Creation confirmation. Returns created TextMessage
          content:
            application/json:
              schema:
                type: object
                properties:
